name: Collect TAIFEX Night Flow
on:
  schedule:
    # Taiwan time: weekdays 06:30 through 12:00, every 30 minutes.
    # GitHub cron is UTC (UTC+8): 06:30 maps to 22:30 UTC on the prior day.
    - cron: '30 22 * * 0-4'
    - cron: '0,30 23 * * 0-4'
    - cron: '0,30 0-4 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'TAIFEX report date YYYY-MM-DD, or auto'
        required: false
        default: auto
        type: string
permissions:
  contents: read
concurrency:
  group: taifex-night-flow-drive-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_DATE: ${{ github.event.inputs.target_date || 'auto' }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      DRIVE_FOLDER_ID: 1bHNCF59WGheGa5Tmo_GDK53T4fxU00oD
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
      - name: Configure and hydrate Drive history
        shell: bash
        run: |
          if [[ -z "$RCLONE_CONFIG_B64" ]]; then
            echo "RCLONE_CONFIG_B64 is not configured; this run will be local-only."
            echo "RCLONE_REMOTE=" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y rclone
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsf "drive:" --drive-root-folder-id "$DRIVE_FOLDER_ID" >/dev/null
          echo "RCLONE_REMOTE=drive" >> "$GITHUB_ENV"
          mkdir -p data
          rclone copy "drive:" data --drive-root-folder-id "$DRIVE_FOLDER_ID" --exclude '.state/**'
      - name: Check whether this trade date is already validated
        id: validation_guard
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date
          from pathlib import Path
          from taifex_night_flow.calendar import CalendarUnavailable, expected_trade_date

          target = os.environ["TARGET_DATE"]
          day = None
          if target == "auto":
              try:
                  open_days = {
                      date.fromisoformat(line.strip())
                      for line in Path("calendar/verified_open_dates.txt").read_text().splitlines()
                      if line.strip() and not line.lstrip().startswith("#")
                  }
                  day = expected_trade_date(verified_open_dates=open_days)
              except (OSError, ValueError, CalendarUnavailable) as exc:
                  print(f"Trade date unresolved; collector will decide safely: {exc}")
          else:
              day = date.fromisoformat(target)

          already_validated = False
          pointer_path = Path("data/latest.json")
          if day is not None and pointer_path.is_file():
              try:
                  pointer = json.loads(pointer_path.read_text(encoding="utf-8"))
                  relative = Path(pointer["snapshot_path"])
                  snapshot_path = (Path("data") / relative).resolve()
                  if (Path("data").resolve() in snapshot_path.parents
                          and pointer.get("status") == "VALIDATED"
                          and pointer.get("trade_date") == day.isoformat()
                          and snapshot_path.is_file()):
                      snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
                      already_validated = (
                          snapshot.get("status") == "VALIDATED"
                          and snapshot.get("trade_date") == day.isoformat()
                      )
              except (KeyError, OSError, ValueError, TypeError):
                  pass

          if already_validated:
              print(f"{day}: validated snapshot already persisted; skipping another fetch.")
          else:
              print(f"{day or target}: no persisted validated snapshot; fetching.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"should_collect={'false' if already_validated else 'true'}\n")
          PY
      - name: Collect and persist
        if: steps.validation_guard.outputs.should_collect == 'true'
        run: taifex-night-flow --date "$TARGET_DATE" --data-dir data
      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taifex-night-flow-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/
          if-no-files-found: warn
          retention-days: 90
